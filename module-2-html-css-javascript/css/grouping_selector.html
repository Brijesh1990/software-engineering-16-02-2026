<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<title>Page Title</title>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel='stylesheet' type='text/css' media='screen' href='main.css'>
<script src='main.js'></script>
<style>
  
#content 
{
width: 80%;
height: auto;
margin: auto;
margin-top: 8%;    
display: flex;
flex-wrap: wrap;
}
/* grouping selector  */
.box1,
.box2,
.box3
{
width: 25%;
height: auto;
margin: auto;
padding: 25px;
background-color: black;
color: white;
border-radius: 30px;    
}
.box1:hover,.box2:hover,.box3:hover 
{
background-color: red;
color: white;    
}
.box1 p,
.box2 p,
.box3 p 
{
font-size: 20px !important;
font-family: Verdana, Geneva, Tahoma, sans-serif;
font-weight: bolder;    
}
</style>
</head>
<body>
<h1 align="center">Get employee details: </h1>    
<section id="content">
<div class="box1"><p>Brijesh Kumar Pandey</p></div>
<div class="box2"><p>Divyang shah</p></div>
<div class="box3"><p>Brijesh gondaliya</p></div>
</section>
</body>
</html>
